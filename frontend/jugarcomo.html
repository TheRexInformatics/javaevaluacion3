<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugar Como</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
  <body class="bg-[url('https://i.redd.it/u5gsn5x658y71.png')] bg-cover bg-center bg-no-repeat bg-fixed text-white">      
    <header class="w-full h-60 flex items-center justify-center bg-black bg-opacity-60">
    <h1 class="text-4xl font-bold text-white-600 tracking-wider">Selecciona tu bando</h1>
  </header>

  <main class="flex flex-col md:flex-row justify-center items-center gap-10 p-10">

    <section class="bg-black p-8 rounded-lg shadow-lg w-80 text-center transition">
        <img src="img/IconHelpLoading_killer.png" alt="Asesino"
        class="w-25 h-25 mx-auto mb-4">
        <h2 class="text-2xl font-semibold mb-4 text-red-500">🔪 Asesino</h2>
        <p class="text-gray-300">Juega como el cazador. Rastrea, acosa y elimina a los supervivientes.</p>
        <a href="killer.html"
        class="inline-block mt-2 px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-semibold rounded transition">
        Jugar como asesino
    </a>
</section>

    <section class="bg-black p-8 rounded-lg shadow-lg w-80 text-center transition">
        <img src="img/IconHelpLoading_survivor.png" alt="Supervivientes"
       class="w-25 h-25 mx-auto mb-4">
       <h2 class="text-2xl font-semibold mb-4 text-blue-500">🧍 Supervivientes</h2>
       <p class="text-gray-300">Trabaja en equipo, repara generadores y escapa del asesino.</p>
       <a href="survi.html"
        class="inline-block mt-2 px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded transition">
        Jugar como superviviente
  </a>
</section>

<a href="index.html"
   class="fixed bottom-4 left-4 bg-sky-400 text-white px-6 py-3 rounded-md font-bold inline-block transition-all duration-300 shadow-lg
          hover:bg-sky-600 hover:-translate-y-1 hover:shadow-xl focus:outline-none z-50">
  Volver al menú
</a>

</body>
</html>
