<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Dead by Daylight</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-cover bg-center bg-no-repeat bg-fixed" style="background-image: url('img/fondologin.png')">

  <div class="min-h-screen flex items-center justify-center bg-black bg-opacity-70">
    <div class="bg-white bg-opacity-10 p-10 rounded-lg shadow-2xl backdrop-blur-md w-full max-w-md text-white">

      <h2 class="text-3xl font-bold text-center mb-6">Iniciar Sesión</h2>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block mb-1 text-sm">Nombre de Usuario</label>
          <input type="text" id="username" class="w-full px-4 py-2 rounded bg-black bg-opacity-50 border border-gray-500 focus:outline-none" placeholder="Username">
        </div>

        <div>
          <label class="block mb-1 text-sm">Correo Electrónico</label>
          <input type="email" id="email" class="w-full px-4 py-2 rounded bg-black bg-opacity-50 border border-gray-500 focus:outline-none" placeholder="Correo Electrónico">
        </div>

        <div>
          <label class="block mb-1 text-sm">Contraseña</label>
          <input type="password" id="password" class="w-full px-4 py-2 rounded bg-black bg-opacity-50 border border-gray-500 focus:outline-none" placeholder="••••••••">
        </div>

        <button type="submit" class="w-full bg-red-700 hover:bg-red-800 text-white font-semibold py-2 rounded transition-all">
          INGRESAR
        </button>
      </form>

    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !email || !password) {
        Swal.fire({
          icon: 'error',
          title: 'Campos incompletos',
          text: 'Por favor completa todos los campos.',
        });
        return;
      }

      Swal.fire({
        icon: 'success',
        title: `¡Bienvenido, ${username}!`,
        text: 'Accediendo al menú...',
        showConfirmButton: false,
        timer: 1500
      }).then(() => {
        window.location.href = "index.html"; 
      });
    });

  </script>
</body>
</html>
